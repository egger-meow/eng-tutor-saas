name: CAP repo bundle one-shot

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack repository
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/eng-tutor-saas.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: cap-repo-source
          path: /tmp/eng-tutor-saas.tgz
          if-no-files-found: error
          retention-days: 1
