name: CAP source bundle one-shot

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cap-source-pdfs
          path: history_exams/raw/*.pdf
          if-no-files-found: error
          retention-days: 1
