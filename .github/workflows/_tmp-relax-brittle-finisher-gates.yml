name: Relax Brittle Finisher Gates

on:
  push:
    branches:
      - fix/relax-brittle-finisher-gates
    paths:
      - scripts/_tmp_relax_brittle_finisher_gates.mjs

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relax-brittle-finisher-gates
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: node scripts/_tmp_relax_brittle_finisher_gates.mjs
      - name: Compile production bundle
        run: pnpm compile:bundle
      - name: Diff check
        run: git diff --check
      - name: Focused regression
        run: pnpm vitest run packages/generator/src/finisher-relaxation-regression.test.ts packages/generator/src/finisher-tiers.test.ts packages/generator/src/bundle-compiler.test.ts
      - name: Full verification
        run: |
          pnpm lint
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SPEC.md packages/generator/src/audit-curriculum.ts packages/generator/src/finisher-tiers.test.ts packages/generator/src/finisher-relaxation-regression.test.ts packages/generator/prompts/2.10.0/02-author.md packages/generator/prompts/2.10.0/03-critic.md packages/generator/bundles/production-authoring-bundle.md
          git commit -m "fix(generator): make brittle quality heuristics non-blocking"
          git push origin HEAD:fix/relax-brittle-finisher-gates
