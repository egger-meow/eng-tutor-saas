name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize deterministic production fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/admin/src/client/types.ts')
          s = p.read_text()
          needle = "  if (isSchema220 && isPrompt240) {\n    return 'engine_v1'\n  }"
          replacement = "  const hasProfile = hasModelQualityProfileProvenance(item)\n  const hasEngineVersion = Boolean(getEngineVersionFromItem(item))\n\n  // Profile provenance normally identifies current evidence. If that provenance itself is broken,\n  // the admin RPC's authoritative engine_version keeps the current submission visible in Current.\n  if (isSchema220 && isPrompt240 && (hasProfile || hasEngineVersion)) {\n    return 'engine_v1'\n  }"
          if needle not in s:
              raise SystemExit('expected classifier condition not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
          pnpm compile:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: production-quality-final-files
          path: |
            apps/admin/src/client/types.ts
            packages/generator/bundles/production-authoring-bundle.md
      - name: Install Traditional Chinese PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: pnpm --filter @paper-english/pdf pdf:install
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
