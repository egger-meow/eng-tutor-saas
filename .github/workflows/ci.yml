name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Traditional Chinese PDF fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/fonts-noto-cjk
          key: fonts-noto-cjk-v1-${{ runner.os }}

      - name: Install or restore Traditional Chinese PDF fonts
        run: |
          if [ "${{ steps.cache-fonts.outputs.cache-hit }}" = "true" ]; then
            echo "Restoring fonts-noto-cjk from cache..."
            sudo mkdir -p /usr/share/fonts/opentype/noto
            sudo cp -r ~/.cache/fonts-noto-cjk/* /usr/share/fonts/opentype/noto/
            sudo fc-cache -f
          else
            echo "Installing fonts-noto-cjk via apt..."
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
            mkdir -p ~/.cache/fonts-noto-cjk
            cp -r /usr/share/fonts/opentype/noto/* ~/.cache/fonts-noto-cjk/ 2>/dev/null || true
            if [ -d /usr/share/fonts/truetype/noto ]; then
              cp -r /usr/share/fonts/truetype/noto/* ~/.cache/fonts-noto-cjk/ 2>/dev/null || true
            fi
          fi
      - name: Cache Playwright Chromium
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm --filter @paper-english/pdf pdf:install
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  sync-week1-spec:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/week1-fast-lane-impl-2'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/week1-fast-lane-impl-2
          fetch-depth: 1
      - run: python scripts/sync-week1-spec.py
      - name: Commit synchronized SPEC to PR branch
        shell: bash
        run: |
          if git diff --quiet -- docs/SPEC.md; then
            echo "SPEC already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SPEC.md
          git commit -m "[spec-sync] align Week 1 Fast Lane product contract"
          git push origin HEAD:"$GITHUB_HEAD_REF"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    environment:
      name: cloudflare-workers
      url: https://paperbond.jjmowlab.com
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PADDLE_CLIENT_TOKEN: ${{ vars.VITE_PADDLE_CLIENT_TOKEN }}
      VITE_PADDLE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate browser build configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_PADDLE_CLIENT_TOKEN"
      - run: pnpm install --frozen-lockfile
      - name: Build production web
        run: pnpm --filter @paper-english/web build
      - name: Deploy production build
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --global wrangler@4
          wrangler deploy --config wrangler.jsonc
