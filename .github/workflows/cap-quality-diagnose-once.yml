name: CAP Quality Diagnose Once

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-quality-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore proven CAP migration runner
        run: git show 0c8caa8f5537ed7a47c9c1743599ea2d912391ef:scripts/history-exams/.tmp-cap-finish.ts > scripts/history-exams/.tmp-cap-finish.ts
      - name: Prepare canonical authored sources in workspace only
        run: |
          pnpm exec tsx scripts/history-exams/.tmp-cap-finish.ts
          node <<'NODE'
          const fs=require('node:fs'); const path=require('node:path');
          const p114='history_exams/agent_analysis/114-q01-q22-27-q29-31-q35-37.json';
          const s114=JSON.parse(fs.readFileSync(p114,'utf8'));
          const explanations={
            1:"Q1 combines the location phrase 'over the houses' with a picture containing several visible flying objects, so the learner must use spatial evidence to select the plane.",
            22:"Q22 requires tracking speakers across the group chat and inferring Linda's attitude toward Mark from her repeated objections and final reaction.",
            23:"Q23 requires inferring the social meaning of 'steal someone's thunder' from the dialogue and transferring that attention-stealing mechanism to a new scenario.",
            24:"Q24 checks precise brochure-detail integration by separating unlimited transport, museum discounts, and zone restrictions that are easy to recombine incorrectly.",
            25:"Q25 integrates the city-zone map, weekday versus weekend validity, and the price table to identify the cheapest combination that satisfies both planned trips.",
            26:"Q26 requires abstracting the category 'vacation farm' from Rolling Acres' combined farm features, animals, crops, and family-vacation function.",
            27:"Q27 is a scope-sensitive main-idea task: the learner must summarize what the first paragraph develops about Libby's work rather than select nearby undeveloped topics.",
            29:"Q29 requires synthesizing a multi-panel causal sequence from resource abundance through depletion, scarcity, conflict, and collapse into the comic's environmental warning.",
            30:"Q30 tests proposition-level detail tracking in the comic, especially the stated purpose for moving statues to fighting grounds rather than keyword recombination.",
            31:"Q31 resolves the event anaphor 'did it' across a concessive sentence, linking it to cutting down the last trees rather than to a nearby consequence or earlier action.",
            35:"Q35 asks for the passage's organizing purpose by linking a historical electricity-worker image to the labor-dispute history supplied as its explanatory context.",
            36:"Q36 integrates the historical image with repeated pay demands and widespread public hardship to infer the critical attitude represented by the picture.",
            37:"Q37 interprets quotation marks around 'dark' by integrating literal electricity-related darkness with the figurative social hardship of the period."
          };
          for(const q of s114.questions) q.skillExplanation=explanations[q.questionNumber] ?? q.skillExplanation;
          fs.writeFileSync(p114,JSON.stringify(s114,null,2)+'\n');
          const p115='history_exams/agent_analysis/115-q35-43.json';
          const s115=JSON.parse(fs.readFileSync(p115,'utf8')); const q38=s115.questions.find(q=>q.questionNumber===38);
          if(!q38) throw new Error('115 Q38 missing');
          q38.primarySkill='cross_sentence_inference'; q38.secondarySkills=[...new Set(['information_integration',...(q38.secondarySkills||[])])];
          fs.writeFileSync(p115,JSON.stringify(s115,null,2)+'\n');
          const dir=path.resolve('history_exams/agent_analysis');
          const meta={providerName:'openai-chatgpt',modelName:'gpt-5.6-sol',promptVersion:'chatgpt-agent-digestion-v2',criticPromptVersion:'chatgpt-agent-critic-v1',analysisSchemaVersion:'1.0.0'};
          for(const examId of ['112','113','114','115']){
            const files=fs.readdirSync(dir).filter(f=>f===`${examId}.json`||f.startsWith(`${examId}-`)).sort(); const qs=new Map();
            for(const file of files){ const s=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8')); for(const [k,v] of Object.entries(meta)) if(s[k]!==v) throw new Error(`${examId}/${file}: ${k} mismatch`); for(const q of s.questions){ if(qs.has(q.questionNumber)&&JSON.stringify(qs.get(q.questionNumber))!==JSON.stringify(q)) throw new Error(`${examId} Q${q.questionNumber}: conflicting source records`); qs.set(q.questionNumber,q); } }
            if(qs.size!==43) throw new Error(`${examId}: ${qs.size} questions`);
            fs.writeFileSync(path.join(dir,`${examId}.json`),JSON.stringify({examId,...meta,questions:[...qs.values()].sort((a,b)=>a.questionNumber-b.questionNumber)},null,2)+'\n');
          }
          NODE
      - name: Print exact diversity distribution
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const exams=['111','112','113','114','115'].map(id=>JSON.parse(fs.readFileSync(`history_exams/agent_analysis/${id}.json`,'utf8')));
          const qs=exams.flatMap(e=>e.questions);
          console.log('PROMPT_VERSIONS', Object.fromEntries(exams.map(e=>[e.examId,e.promptVersion])));
          for(const key of ['questionMechanism','whyTheQuestionWorks','reusableDesignPrinciple','skillExplanation']){
            const counts=new Map(); for(const q of qs){const v=String(q[key]||'').trim(); counts.set(v,(counts.get(v)||0)+1);}
            const sorted=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
            console.log(`DIVERSITY ${key} unique=${counts.size} maxFrequency=${sorted[0]?.[1]||0}`);
            console.log(`TOP ${key}`, JSON.stringify(sorted.slice(0,10)));
          }
          NODE
