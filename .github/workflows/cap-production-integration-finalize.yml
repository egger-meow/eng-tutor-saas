name: CAP Production Integration Finalizer

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-production-integration-finalize.yml
      - scripts/cap-production-integration-patch.py
      - scripts/cap-production-routing-patch.py
      - scripts/cap-production-contract-compact.py
      - tests/history-exams/rolling-window.test.ts

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cap-chatgpt-deep-digestion
          fetch-depth: 0

      - name: Apply reviewed integration patch
        run: |
          python3 scripts/cap-production-integration-patch.py
          python3 scripts/cap-production-routing-patch.py
          python3 scripts/cap-production-contract-compact.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify existing CAP authority
        run: pnpm history-exams validate

      - name: Rebuild rich non-holdout runtime, compact routing, and shards
        run: pnpm history-exams precedents

      - name: Compile Prompt 2.9 production bundle
        run: pnpm compile:bundle

      - name: Focused CAP regressions
        run: pnpm exec vitest run tests/history-exams/rolling-window.test.ts tests/history-exams/precedent-cards.test.ts packages/generator/src/cap-precedent-audit.test.ts packages/generator/src/cap-precedent-evaluation.test.ts packages/generator/src/bundle-compiler.test.ts

      - name: Revalidate authoritative CAP corpus
        run: pnpm history-exams validate

      - name: Install Traditional Chinese PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          sudo fc-cache -f

      - name: Install Playwright Chromium
        run: pnpm --filter @paper-english/pdf pdf:install

      - name: Verify lint
        run: pnpm lint

      - name: Verify tests
        run: pnpm test

      - name: Verify typecheck
        run: pnpm typecheck

      - name: Verify build
        run: pnpm build

      - name: Verify deterministic bundle
        run: pnpm compile:bundle

      - name: Verify synthetic PDF generation
        run: pnpm generate:synthetic

      - name: Verify diff hygiene
        run: git diff --check

      - name: Seal verified rolling window and prove reuse
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { reconcileRollingWindow, commitRollingWindowManifest } from './scripts/history-exams/src/corpus/rolling-window.ts'; const root=process.cwd(); const args={rawDir:path.resolve(root,'history_exams/raw'),extractedDir:path.resolve(root,'history_exams/extracted'),analyzedDir:path.resolve(root,'history_exams/analyzed'),assetsDir:path.resolve(root,'history_exams/assets'),agentAnalysisDir:path.resolve(root,'history_exams/agent_analysis')}; const result=reconcileRollingWindow(args); commitRollingWindowManifest(args.rawDir,result);"
          pnpm exec tsx -e "import path from 'node:path'; import { reconcileRollingWindow } from './scripts/history-exams/src/corpus/rolling-window.ts'; const root=process.cwd(); const result=reconcileRollingWindow({rawDir:path.resolve(root,'history_exams/raw'),extractedDir:path.resolve(root,'history_exams/extracted'),analyzedDir:path.resolve(root,'history_exams/analyzed'),assetsDir:path.resolve(root,'history_exams/assets'),agentAnalysisDir:path.resolve(root,'history_exams/agent_analysis')}); if(result.unchangedExamIds.join(',')!=='111,112,113,114,115'||result.changedExamIds.length) throw new Error(JSON.stringify(result)); console.log(JSON.stringify(result));"

      - name: Remove one-shot helpers
        run: git rm .github/workflows/cap-production-integration-finalize.yml scripts/cap-production-integration-patch.py scripts/cap-production-routing-patch.py scripts/cap-production-contract-compact.py

      - name: Commit verified integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(generator): enforce CAP precedent-first production quality floor"
          git push origin HEAD:feat/cap-chatgpt-deep-digestion
