name: Temporary compact prompt materializer

on:
  push:
    branches:
      - fix/grounding-attribution-integrity
    paths:
      - .github/workflows/materialize-compact-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grounding-attribution-integrity
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Synchronize stale admin version expectations
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/admin/src/server/admin-service.test.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "expect(CURRENT_ENGINE_VERSION).toBe('1.5.0')": "expect(CURRENT_ENGINE_VERSION).toBe('1.6.0')",
              "expect(CURRENT_PROMPT_VERSION).toBe('2.10.1')": "expect(CURRENT_PROMPT_VERSION).toBe('2.11.0')",
              "expect(formatEngineVersion()).toBe('Engine v1.5.0')": "expect(formatEngineVersion()).toBe('Engine v1.6.0')",
              "expect(formatEngineEraLabel('engine_v1')).toBe('Engine v1.5.0')": "expect(formatEngineEraLabel('engine_v1')).toBe('Engine v1.6.0')",
              "expect(currentExport.provenance.currentEraName).toBe('Engine v1.5.0')": "expect(currentExport.provenance.currentEraName).toBe('Engine v1.6.0')",
              "expect(currentExport.provenance.currentEngineVersion).toBe('1.5.0')": "expect(currentExport.provenance.currentEngineVersion).toBe('1.6.0')",
              "expect(currentExport.provenance.currentPromptVersion).toBe('2.10.1')": "expect(currentExport.provenance.currentPromptVersion).toBe('2.11.0')",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

      - name: Compile production bundle
        run: pnpm --filter @paper-english/generator compile:bundle

      - name: Run focused regressions
        run: >-
          pnpm exec vitest run
          packages/generator/src/recency-grounding-contract.test.ts
          packages/generator/src/production-failure-regression.test.ts
          packages/generator/src/bundle-compiler.test.ts
          packages/generator/src/pedagogy-contract.test.ts
          apps/admin/src/server/admin-service.test.ts

      - name: Commit materialized artifacts and self-delete
        run: |
          rm .github/workflows/materialize-compact-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/admin-service.test.ts packages/generator/bundles/production-authoring-bundle.md .github/workflows/materialize-compact-fix.yml
          git diff --cached --check
          git commit -m "chore: materialize prompt 2.11 compact bundle"
          git push origin HEAD:fix/grounding-attribution-integrity
