name: CAP Finish Once V3

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-finish-once-v3.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fresh deterministic extraction
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { runExtractionPipeline } from './scripts/history-exams/src/extractor/index.ts'; (async()=>{ const root=process.cwd(); const r=await runExtractionPipeline({rawDir:path.resolve(root,'history_exams/raw'),outputDir:path.resolve(root,'history_exams/extracted'),assetsDir:path.resolve(root,'history_exams/assets'),renderImages:false}); if(r.length!==5) throw new Error('expected 5 extracted exams, got '+r.length); console.log(r.map(x=>x.examId+':'+x.questionCount).join(',')); })();"

      - name: Source-fidelity and answer locks
        run: pnpm test tests/history-exams/extractor.test.ts tests/history-exams/official-answers.test.ts

      - name: Normalize genuine authored source and sync holdout
        run: |
          git show 0c8caa8f5537ed7a47c9c1743599ea2d912391ef:scripts/history-exams/.tmp-cap-finish.ts > scripts/history-exams/.tmp-cap-finish.ts
          sed -i '/^repairExtracted();$/d' scripts/history-exams/.tmp-cap-finish.ts
          pnpm exec tsx scripts/history-exams/.tmp-cap-finish.ts
          rm scripts/history-exams/.tmp-cap-finish.ts

      - name: Prepare canonical authoritative corpus
        run: pnpm exec tsx scripts/history-exams/src/finalize/prepare-authoritative.ts

      - name: Source quality contract
        run: pnpm test tests/history-exams/agent-analysis-quality.test.ts

      - name: Cross-year synthesis
        run: pnpm history-exams synthesize
      - name: Benchmark
        run: pnpm history-exams benchmark
      - name: Spot check
        run: pnpm history-exams spot-check
      - name: Validate corpus
        run: pnpm history-exams validate
      - name: Assert authoritative status
        run: pnpm exec tsx -e "import path from 'node:path'; import { validateFullCorpus } from './scripts/history-exams/src/validator/index.ts'; const r=validateFullCorpus({extractedDir:path.resolve('history_exams/extracted'),analyzedDir:path.resolve('history_exams/analyzed'),knowledgeDir:path.resolve('history_exams/knowledge'),benchmarkDir:path.resolve('history_exams/benchmark')}); console.log(JSON.stringify(r,null,2)); if(!r.structurallyValid||!r.authorityEligible||r.authorityStatus!=='authoritative'||r.authorityBlockers.length) process.exit(1);"

      - name: Final CAP regression locks
        run: pnpm test tests/history-exams/official-answers.test.ts tests/history-exams/extractor.test.ts tests/history-exams/agent-analysis-quality.test.ts tests/history-exams/validator.test.ts

      - name: Lint
        run: pnpm lint
      - name: Full tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

      - name: Commit authoritative artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_exams scripts/history-exams/src/extractor scripts/history-exams/src/finalize tests/history-exams
          if git diff --cached --quiet; then echo 'No authoritative changes to commit'; exit 1; fi
          git commit -m "feat(history-exams): certify authoritative CAP digestion"
          git push origin HEAD:${GITHUB_REF_NAME}
