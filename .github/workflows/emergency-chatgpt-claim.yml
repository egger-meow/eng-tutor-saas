name: Emergency ChatGPT Scheduled Work Claim

on:
  push:
    branches:
      - hotfix/scheduled-claim-recovery
    paths:
      - .github/workflows/emergency-chatgpt-claim.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Claim Scheduled Work batch exactly once
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL is missing'; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo 'SUPABASE_SECRET_KEY is missing'; exit 1; }

          response="$(curl --silent --show-error --fail-with-body \
            "$SUPABASE_URL/rest/v1/rpc/chatgpt_claim_generation_batch_for_scheduled_work" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}')"

          claimed_count="$(printf '%s' "$response" | jq -r '.claimedCount // -1')"
          test "$claimed_count" -ge 0 || { echo 'Claim bridge returned an invalid response'; exit 1; }
          echo "claimedCount=$claimed_count"
