name: Apply Finisher Calibration Patch

on:
  push:
    branches:
      - fix/finisher-false-positive-calibration
    paths:
      - scripts/_tmp_apply_finisher_calibration.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finisher-false-positive-calibration
          fetch-depth: 0
      - name: Apply focused production patch
        run: node scripts/_tmp_apply_finisher_calibration.mjs
      - name: Validate patch shape
        run: git diff --check
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/generator/src/cap-precedent-audit.ts packages/generator/src/audit-curriculum.ts packages/generator/src/finisher-calibration-regression.test.ts
          git commit -m "fix(generator): calibrate quote and morphology gates"
          git push origin HEAD:fix/finisher-false-positive-calibration
