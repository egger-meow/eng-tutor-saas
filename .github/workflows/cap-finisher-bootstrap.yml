name: CAP Finisher Bootstrap

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-finisher-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore corrected final finisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 2cab7b404dfce993c01a7c731fe3de7c3a59f42d:.github/workflows/cap-finish-once.yml > .github/workflows/cap-finish-once.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/cap-finish-once.yml')
          s=p.read_text()
          old="const values=new Set(qs.map(q=>String(q[key]||'').trim());"
          new="const values=new Set(qs.map(q=>String(q[key]||'').trim()));"
          if old not in s:
              raise SystemExit('expected finisher syntax target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/cap-finisher-bootstrap.yml
          git add .github/workflows/cap-finish-once.yml
          git commit -m "chore(history-exams): retry corrected CAP finisher"
          git push origin HEAD:${GITHUB_REF_NAME}
