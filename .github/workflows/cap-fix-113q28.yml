name: CAP Fix 113 Q28

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-fix-113q28.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch verified source semantics
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p='history_exams/agent_analysis/113-q01-q24-28-q41.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const q=x.questions.find(q=>q.questionNumber===28);
          if(!q) throw new Error('113 Q28 missing');
          if(!String(q.whyTheQuestionWorks).includes('pragmatic intent')) throw new Error('113 Q28 source no longer supports pragmatic semantic lock');
          q.primarySkill='pragmatic_meaning';
          q.secondarySkills=[...new Set(['local_inference',...(q.secondarySkills||[]).filter(s=>s!=='pragmatic_inference')])];
          q.skillExplanation='Infer the hosts’ shared social flaw by interpreting the guests’ sarcastic responses across both anecdotes.';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          sed -i "s/chat.genre = 'dialogue_chat';/chat.genre = 'dialogue';/" scripts/history-exams/src/extractor/source-fidelity-overrides.ts
      - name: Commit verified source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_exams/agent_analysis/113-q01-q24-28-q41.json scripts/history-exams/src/extractor/source-fidelity-overrides.ts
          git commit -m "fix(history-exams): preserve 113 Q28 pragmatic semantics"
          git push origin HEAD:${GITHUB_REF_NAME}
