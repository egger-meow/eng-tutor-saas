name: Diagnose Week 3 sample materializer cwd

on:
  push:
    branches: [fix/public-week3-sample]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --filter @paper-english/worker exec node -e "console.log(process.cwd())"
