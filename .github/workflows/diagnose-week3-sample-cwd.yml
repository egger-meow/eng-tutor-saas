name: Materialize exact Week 3 sample bytes

on:
  push:
    branches: [fix/public-week3-sample]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download exact Week 3 production PDFs to repo-root sample paths
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          cat > packages/worker/src/materialize-week3-public-sample.ts <<'TS'
          import { createClient } from '@supabase/supabase-js'
          import { createHash } from 'node:crypto'
          import { mkdir, writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'

          const supabaseUrl = process.env.SUPABASE_URL
          const supabaseSecretKey = process.env.SUPABASE_SECRET_KEY
          if (!supabaseUrl || !supabaseSecretKey) throw new Error('Missing Supabase credentials')

          const repoRoot = resolve(import.meta.dirname, '../../..')
          const sampleDir = resolve(repoRoot, 'apps/web/public/samples')
          const supabase = createClient(supabaseUrl, supabaseSecretKey, {
            auth: { persistSession: false, autoRefreshToken: false },
          })
          const materialId = '62efe27e-ba9a-4f52-988c-c51dc5fbb4e5'
          const { data: material, error: materialError } = await supabase
            .from('materials')
            .select('material_week,prompt_version,canonical_source,student_pdf_path,parent_answer_pdf_path')
            .eq('id', materialId)
            .single()
          if (materialError || !material) throw materialError ?? new Error('Week 3 material not found')

          const title = material.canonical_source?.metadata?.title
          if (material.material_week !== '2026-09-13') throw new Error(`Unexpected material week: ${material.material_week}`)
          if (material.prompt_version !== '2.11.0') throw new Error(`Unexpected prompt version: ${material.prompt_version}`)
          if (title !== 'How Does a Game Place Sound Around You?') throw new Error(`Unexpected title: ${title}`)
          if (!material.student_pdf_path || !material.parent_answer_pdf_path) throw new Error('Week 3 PDF paths are incomplete')

          const files = [
            {
              source: material.student_pdf_path,
              output: resolve(sampleDir, 'sample-student.pdf'),
              size: 1333268,
              md5: 'd7060fc64f129d6c5e3d23311bd58258',
            },
            {
              source: material.parent_answer_pdf_path,
              output: resolve(sampleDir, 'sample-parent-answer.pdf'),
              size: 739496,
              md5: '121d7d635ed5c3d38643fe4e19f6d8dd',
            },
          ] as const

          await mkdir(sampleDir, { recursive: true })
          for (const file of files) {
            const { data, error } = await supabase.storage.from('weekly-materials').download(file.source)
            if (error || !data) throw error ?? new Error(`Failed to download ${file.source}`)
            const bytes = Buffer.from(await data.arrayBuffer())
            const md5 = createHash('md5').update(bytes).digest('hex')
            if (bytes.length !== file.size) throw new Error(`Unexpected size for ${file.source}: ${bytes.length}`)
            if (md5 !== file.md5) throw new Error(`Unexpected MD5 for ${file.source}: ${md5}`)
            if (!bytes.subarray(0, 5).equals(Buffer.from('%PDF-'))) throw new Error(`${file.source} is not a PDF`)
            await writeFile(file.output, bytes)
            console.log(`${file.output}: ${bytes.length} bytes, md5=${md5}`)
          }
          TS
          pnpm --filter @paper-english/worker exec tsx src/materialize-week3-public-sample.ts
          rm packages/worker/src/materialize-week3-public-sample.ts

      - name: Verify repo-root files changed to exact production bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'sample-student.pdf': (1333268, 'd7060fc64f129d6c5e3d23311bd58258'),
              'sample-parent-answer.pdf': (739496, '121d7d635ed5c3d38643fe4e19f6d8dd'),
          }
          for name, (size, md5) in expected.items():
              data = (Path('apps/web/public/samples') / name).read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert hashlib.md5(data).hexdigest() == md5, name
              assert data.startswith(b'%PDF-'), name
              print(name, len(data), hashlib.md5(data).hexdigest())
          PY
          git status --short
          git diff --quiet -- apps/web/public/samples/sample-student.pdf && { echo 'student sample did not change'; exit 1; } || true
          git diff --quiet -- apps/web/public/samples/sample-parent-answer.pdf && { echo 'parent sample did not change'; exit 1; } || true

      - name: Commit exact PDFs and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-week3-sample-cwd.yml
          git add apps/web/public/samples/sample-student.pdf apps/web/public/samples/sample-parent-answer.pdf
          git commit -m 'fix(web): use exact Week 3 production PDFs'
          git push
