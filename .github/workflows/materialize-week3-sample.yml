name: Materialize Week 3 public sample

on:
  push:
    branches: [fix/public-week3-sample]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download exact completed Week 3 PDFs from private production storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          cat > packages/worker/src/materialize-week3-public-sample.ts <<'TS'
          import { createClient } from '@supabase/supabase-js'
          import { mkdir, writeFile } from 'node:fs/promises'

          const supabaseUrl = process.env.SUPABASE_URL
          const supabaseSecretKey = process.env.SUPABASE_SECRET_KEY
          if (!supabaseUrl || !supabaseSecretKey) throw new Error('Missing Supabase credentials')

          const supabase = createClient(supabaseUrl, supabaseSecretKey, {
            auth: { persistSession: false, autoRefreshToken: false },
          })
          const materialId = '62efe27e-ba9a-4f52-988c-c51dc5fbb4e5'
          const { data: material, error: materialError } = await supabase
            .from('materials')
            .select('material_week,prompt_version,canonical_source,student_pdf_path,parent_answer_pdf_path')
            .eq('id', materialId)
            .single()
          if (materialError || !material) throw materialError ?? new Error('Week 3 material not found')

          const title = material.canonical_source?.metadata?.title
          if (material.material_week !== '2026-09-13') throw new Error(`Unexpected material week: ${material.material_week}`)
          if (material.prompt_version !== '2.11.0') throw new Error(`Unexpected prompt version: ${material.prompt_version}`)
          if (title !== 'How Does a Game Place Sound Around You?') throw new Error(`Unexpected title: ${title}`)
          if (!material.student_pdf_path || !material.parent_answer_pdf_path) throw new Error('Week 3 PDF paths are incomplete')

          await mkdir('apps/web/public/samples', { recursive: true })
          for (const [path, output] of [
            [material.student_pdf_path, 'apps/web/public/samples/sample-student.pdf'],
            [material.parent_answer_pdf_path, 'apps/web/public/samples/sample-parent-answer.pdf'],
          ] as const) {
            const { data, error } = await supabase.storage.from('weekly-materials').download(path)
            if (error || !data) throw error ?? new Error(`Failed to download ${output}`)
            await writeFile(output, Buffer.from(await data.arrayBuffer()))
          }
          TS
          pnpm --filter @paper-english/worker exec tsx src/materialize-week3-public-sample.ts
          rm packages/worker/src/materialize-week3-public-sample.ts

      - name: Verify downloaded PDF files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('sample-student.pdf', 'sample-parent-answer.pdf'):
              path = Path('apps/web/public/samples') / name
              data = path.read_bytes()
              if not data.startswith(b'%PDF-'):
                  raise SystemExit(f'{name} is not a PDF')
              if len(data) < 100_000:
                  raise SystemExit(f'{name} is unexpectedly small: {len(data)} bytes')
              print(name, len(data))
          PY

      - name: Point the landing sample story at the real Week 3 output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/routes/LandingPage.tsx')
          text = path.read_text()
          replacements = {
              '<span className="sample-context-badge">範例拆解</span>': '<span className="sample-context-badge">真實第 3 週範例</span>',
              '<h3 className="sample-context-title">興趣怎麼真的改變這份教材？</h3>': '<h3 className="sample-context-title">這不是為廣告另外做的展示教材</h3>',
              '<strong>範例學生</strong>：國一 ｜ 英文基礎建立中 ｜ 每週約 75 分鐘 ｜ 目標：<strong>閱讀理解</strong>': '<strong>範例學生</strong>：國一 ｜ 第 3 週 ｜ 預計 94 分鐘 ｜ 目標：<strong>閱讀理解、證據整合與位置表達</strong>',
              '孩子喜歡 Minecraft、科技與解謎，因此這週不是把興趣名稱貼在制式文章上，而是把它轉化成方塊建造遊戲感的科技門故障排除任務：讀訊號、比較測試結果、找出文章證據，再練 am / is / are。': '這是同一名內部測試學生連續使用到第 3 週後，系統實際產出的 Student PDF 與 Parent Answer PDF。公開版只展示教材，不公開學生身分、原始回饋或內部生成資料。',
              '<span className="tag-pill tag-accent">Minecraft</span>\n                    <span className="tag-pill tag-accent">科技</span>\n                    <span className="tag-pill tag-accent">解謎</span>': '<span className="tag-pill tag-accent">遊戲</span>\n                    <span className="tag-pill tag-accent">AI</span>\n                    <span className="tag-pill tag-accent">音樂科技</span>',
              '<span className="tag-pill">國一</span>\n                    <span className="tag-pill">英文基礎建立中</span>': '<span className="tag-pill">國一</span>\n                    <span className="tag-pill">第 3 週</span>',
              '<span className="tag-pill">閱讀理解</span>': '<span className="tag-pill">位置介系詞</span>\n                    <span className="tag-pill">跨段證據推論</span>',
              '<strong className="output-title">The Signal Door Test</strong>': '<strong className="output-title">How Does a Game Place Sound Around You?</strong>',
              '<span className="output-subtitle">科技故障排除閱讀＋be 動詞＋證據判讀</span>': '<span className="output-subtitle">spatial audio 閱讀＋at/on/in＋distance/direction/obstruction 推論</span>',
              '<strong>孩子喜歡什麼，決定我們怎麼帶他進入英文；他最後學會的，仍然是能帶去學校、段考與會考的英文能力。</strong>': '<strong>興趣不是只換故事皮膚；這週把遊戲聲音帶進 spatial audio，真正練的是位置介系詞、閱讀證據與多條件推論。</strong>',
              '主題是引導閱讀的興趣載體，累積的單字、文法、上下文理解與推論能力皆能跨題材轉移。': '這兩份 PDF 就是系統實際產出的教材，不是另外製作的展示稿。',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one landing match, found {count}: {old[:80]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Add public-sample regression
        shell: bash
        run: |
          cat > apps/web/src/routes/LandingPage.public-sample.test.tsx <<'TSX'
          import { describe, expect, it } from 'vitest'
          import { renderToStaticMarkup } from 'react-dom/server'
          import { LandingPage } from './LandingPage'

          describe('Landing Page — public Week 3 sample', () => {
            it('shows the real Week 3 sample story and keeps the student/parent PDF pair aligned', () => {
              const html = renderToStaticMarkup(<LandingPage />)

              expect(html).toContain('真實第 3 週範例')
              expect(html).toContain('這不是為廣告另外做的展示教材')
              expect(html).toContain('How Does a Game Place Sound Around You?')
              expect(html).toContain('預計 94 分鐘')
              expect(html).toContain('spatial audio 閱讀＋at/on/in＋distance/direction/obstruction 推論')
              expect(html).toContain('/samples/sample-student.pdf')
              expect(html).toContain('/samples/sample-parent-answer.pdf')
              expect(html).not.toContain('The Signal Door Test')
            })
          })
          TSX

      - name: Run focused regression and web typecheck
        run: |
          pnpm exec vitest run apps/web/src/routes/LandingPage.public-sample.test.tsx
          pnpm --filter @paper-english/web typecheck

      - name: Commit materialized public sample and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-week3-sample.yml
          git add apps/web/public/samples/sample-student.pdf \
                  apps/web/public/samples/sample-parent-answer.pdf \
                  apps/web/src/routes/LandingPage.tsx \
                  apps/web/src/routes/LandingPage.public-sample.test.tsx
          git commit -m 'feat(web): publish real Week 3 sample'
          git push
