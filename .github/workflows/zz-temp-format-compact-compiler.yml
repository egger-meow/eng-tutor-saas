name: One-shot compact compiler formatter

on:
  push:
    branches:
      - fix/grounding-attribution-integrity

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize compact compiler formatting and self-remove
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/generator/src/bundle-compiler.ts')
          text = path.read_text(encoding='utf-8')
          fixed = """  const readPromptStage = async (fileName: string) => {
            const stage = await readFile(resolve(repoRoot, `packages/generator/prompts/2.11.0/${fileName}`), 'utf8')
            return `${stage.trim()}\\n`
          }
          const plan = await readPromptStage('01-plan.md')
          """
          pattern = re.compile(
              r"  const readPromptStage = async \(fileName: string\) => \{[\s\S]*?\n\s*const plan = await readPromptStage\('01-plan\.md'\)\n"
          )
          text, count = pattern.subn(lambda _m: fixed, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one readPromptStage block, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY
          grep -F '    return `${stage.trim()}\n`' packages/generator/src/bundle-compiler.ts
          git rm .github/workflows/zz-temp-format-compact-compiler.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/generator/src/bundle-compiler.ts
          git commit -m 'style(generator): normalize compact compiler formatting safely'
          git push
