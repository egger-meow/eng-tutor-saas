name: Deploy web to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: cloudflare-workers
      url: https://paperbond.jjmowlab.com
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_PADDLE_CLIENT_TOKEN: ${{ vars.VITE_PADDLE_CLIENT_TOKEN }}
      VITE_PADDLE_ENV: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Validate browser build configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_PADDLE_CLIENT_TOKEN"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paper-english/web build
      - name: Deploy production build
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
