name: CAP burn workflow patch
on:
  push:
    paths:
      - .github/workflows/cap-burn-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cap-chatgpt-deep-digestion
          fetch-depth: 0
      - name: Patch burn workflow
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/cap-agent-burn.yml')
          s=p.read_text()
          old="""          if old2 not in s: raise SystemExit('visual placeholder anchor not found')
          s=s.replace(old2,new2)
"""
          new="""          target = 'passageText = `[Visual/Graphic Content in Source PDF: ${genre} on page ${block.pageStart}]`;'
          replacement = 'passageText = curatedVisualPassageText(passageId) ?? `[Visual/Graphic Content in Source PDF: ${genre} on page ${block.pageStart}]`;'
          if target not in s: raise SystemExit('visual placeholder assignment not found')
          s=s.replace(target,replacement,1)
"""
          if old not in s: raise SystemExit('burn workflow anchor not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cap-agent-burn.yml
          git commit -m 'fix(history-exams): make CAP visual patch resilient'
          git push origin HEAD:feat/cap-chatgpt-deep-digestion
