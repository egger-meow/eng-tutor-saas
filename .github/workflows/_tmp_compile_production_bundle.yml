name: Temporary production bundle compile

on:
  push:
    branches: [agent/fix-production-quality-stack]

permissions:
  contents: write

jobs:
  compile:
    if: github.event.head_commit.message != 'chore: compile production bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-quality-stack
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile:bundle
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/generator/bundles/production-authoring-bundle.md
          if git diff --cached --quiet; then
            echo "Bundle already current"
          else
            git commit -m "chore: compile production bundle"
            git push
          fi
