name: CAP Finish Once

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-finish-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fix final source schema typo
        run: sed -i "s/chat.genre = 'dialogue_chat';/chat.genre = 'dialogue';/" scripts/history-exams/src/extractor/source-fidelity-overrides.ts

      - name: Fresh deterministic extraction with permanent source-fidelity overrides
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { runExtractionPipeline } from './scripts/history-exams/src/extractor/index.ts'; (async()=>{ const root=process.cwd(); const r=await runExtractionPipeline({rawDir:path.resolve(root,'history_exams/raw'),outputDir:path.resolve(root,'history_exams/extracted'),assetsDir:path.resolve(root,'history_exams/assets'),renderImages:false}); if(r.length!==5) throw new Error('expected 5 extracted exams, got '+r.length); console.log(r.map(x=>x.examId+':'+x.questionCount).join(',')); })();"

      - name: Verify source-fidelity and official-answer locks before analysis ingest
        run: pnpm test tests/history-exams/extractor.test.ts tests/history-exams/official-answers.test.ts

      - name: Restore proven source normalizer without legacy extracted repair
        run: |
          git show 0c8caa8f5537ed7a47c9c1743599ea2d912391ef:scripts/history-exams/.tmp-cap-finish.ts > scripts/history-exams/.tmp-cap-finish.ts
          sed -i '/^repairExtracted();$/d' scripts/history-exams/.tmp-cap-finish.ts
          pnpm exec tsx scripts/history-exams/.tmp-cap-finish.ts

      - name: Complete authored taxonomy semantics
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p114='history_exams/agent_analysis/114-q01-q22-27-q29-31-q35-37.json';
          const s114=JSON.parse(fs.readFileSync(p114,'utf8'));
          const explanations={
            1:"Q1 combines the location phrase 'over the houses' with a picture containing several visible flying objects, so the learner must use spatial evidence to select the plane.",
            22:"Q22 requires tracking speakers across the group chat and inferring Linda's attitude toward Mark from her repeated objections and final reaction.",
            23:"Q23 requires inferring the social meaning of 'steal someone's thunder' from the dialogue and transferring that attention-stealing mechanism to a new scenario.",
            24:"Q24 checks precise brochure-detail integration by separating unlimited transport, museum discounts, and zone restrictions that are easy to recombine incorrectly.",
            25:"Q25 integrates the city-zone map, weekday versus weekend validity, and the price table to identify the cheapest combination that satisfies both planned trips.",
            26:"Q26 requires abstracting the category 'vacation farm' from Rolling Acres' combined farm features, animals, crops, and family-vacation function.",
            27:"Q27 is a scope-sensitive main-idea task: the learner must summarize what the first paragraph develops about Libby's work rather than select nearby undeveloped topics.",
            29:"Q29 requires synthesizing a multi-panel causal sequence from resource abundance through depletion, scarcity, conflict, and collapse into the comic's environmental warning.",
            30:"Q30 tests proposition-level detail tracking in the comic, especially the stated purpose for moving statues to fighting grounds rather than keyword recombination.",
            31:"Q31 resolves the event anaphor 'did it' across a concessive sentence, linking it to cutting down the last trees rather than to a nearby consequence or earlier action.",
            35:"Q35 asks for the passage's organizing purpose by linking a historical electricity-worker image to the labor-dispute history supplied as its explanatory context.",
            36:"Q36 integrates the historical image with repeated pay demands and widespread public hardship to infer the critical attitude represented by the picture.",
            37:"Q37 interprets quotation marks around 'dark' by integrating literal electricity-related darkness with the figurative social hardship of the period."
          };
          for(const q of s114.questions) q.skillExplanation=explanations[q.questionNumber] ?? q.skillExplanation;
          fs.writeFileSync(p114,JSON.stringify(s114,null,2)+'\n');

          const p115='history_exams/agent_analysis/115-q35-43.json';
          const s115=JSON.parse(fs.readFileSync(p115,'utf8'));
          const q38=s115.questions.find(q=>q.questionNumber===38);
          if(!q38) throw new Error('115 Q38 missing');
          q38.primarySkill='cross_sentence_inference';
          q38.secondarySkills=[...new Set(['information_integration',...(q38.secondarySkills||[])])];
          fs.writeFileSync(p115,JSON.stringify(s115,null,2)+'\n');
          NODE

      - name: Consolidate genuine authored fragments into five yearly sources
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const path=require('node:path');
          const dir=path.resolve('history_exams/agent_analysis');
          const v2={providerName:'openai-chatgpt',modelName:'gpt-5.6-sol',promptVersion:'chatgpt-agent-digestion-v2',criticPromptVersion:'chatgpt-agent-critic-v1',analysisSchemaVersion:'1.0.0'};
          for(const examId of ['112','113','114','115']){
            const files=fs.readdirSync(dir).filter(f=>f===`${examId}.json`||f.startsWith(`${examId}-`)).sort();
            const qs=new Map();
            for(const file of files){
              const s=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
              for(const [k,v] of Object.entries(v2)) if(s[k]!==v) throw new Error(`${examId}/${file}: ${k}=${s[k]} expected ${v}`);
              for(const q of s.questions){
                if(qs.has(q.questionNumber) && JSON.stringify(qs.get(q.questionNumber))!==JSON.stringify(q)) throw new Error(`${examId} Q${q.questionNumber}: conflicting source records`);
                qs.set(q.questionNumber,q);
              }
            }
            const missing=Array.from({length:43},(_,i)=>i+1).filter(n=>!qs.has(n));
            if(qs.size!==43) throw new Error(`${examId}: ${qs.size} questions; missing ${missing.join(',')}`);
            fs.writeFileSync(path.join(dir,`${examId}.json`),JSON.stringify({examId,...v2,questions:[...qs.values()].sort((a,b)=>a.questionNumber-b.questionNumber)},null,2)+'\n');
            for(const f of files) if(f!==`${examId}.json`) fs.unlinkSync(path.join(dir,f));
          }
          const y111=JSON.parse(fs.readFileSync(path.join(dir,'111.json'),'utf8'));
          if(y111.questions.length!==43 || y111.promptVersion!=='chatgpt-agent-digestion-v1') throw new Error('111 truthful v1 provenance/coverage lock failed');
          NODE

      - name: Verify calibrated diversity and provenance contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const exams=['111','112','113','114','115'].map(id=>JSON.parse(fs.readFileSync(`history_exams/agent_analysis/${id}.json`,'utf8')));
          const qs=exams.flatMap(e=>e.questions);
          if(qs.length!==215) throw new Error(`questions=${qs.length}`);
          const expectedPrompts={111:'chatgpt-agent-digestion-v1',112:'chatgpt-agent-digestion-v2',113:'chatgpt-agent-digestion-v2',114:'chatgpt-agent-digestion-v2',115:'chatgpt-agent-digestion-v2'};
          for(const e of exams) if(e.promptVersion!==expectedPrompts[e.examId]) throw new Error(`${e.examId}: prompt provenance ${e.promptVersion}`);
          for(const key of ['questionMechanism','whyTheQuestionWorks','skillExplanation']){
            const values=new Set(qs.map(q=>String(q[key]||'').trim());
            console.log(`${key}: unique=${values.size}`);
            if(values.size<200 || values.has('')) throw new Error(`${key}: unique=${values.size}, blank=${values.has('')}`);
          }
          const counts=new Map();
          for(const q of qs){const v=String(q.reusableDesignPrinciple||'').trim(); counts.set(v,(counts.get(v)||0)+1);}
          const max=Math.max(...counts.values());
          console.log(`reusableDesignPrinciple: unique=${counts.size}, maxFrequency=${max}`);
          if(counts.size<150 || max>10 || counts.has('')) throw new Error(`reusableDesignPrinciple: unique=${counts.size}, maxFrequency=${max}, blank=${counts.has('')}`);
          NODE
          pnpm test tests/history-exams/agent-analysis-quality.test.ts

      - name: Re-ingest all 215 authored records with canonical image-byte hashes
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { ingestAgentAnalysisFiles } from './scripts/history-exams/src/agent-ingest/index.ts'; const o={sourceDir:path.resolve('history_exams/agent_analysis'),extractedDir:path.resolve('history_exams/extracted'),analyzedDir:path.resolve('history_exams/analyzed')}; for(const id of ['111','112','113','114','115']){const r=ingestAgentAnalysisFiles({...o,examIdFilter:id}); if(r.ingestedQuestions!==43) throw new Error(id+': expected 43, got '+r.ingestedQuestions); console.log(id+':'+r.ingestedQuestions);}"

      - name: Write truthful run manifest and assert canonical corpus
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const crypto=require('node:crypto'); const cp=require('node:child_process');
          const ids=['111','112','113','114','115']; const exams=ids.map(id=>JSON.parse(fs.readFileSync(`history_exams/analyzed/${id}.json`,'utf8'))); const qs=exams.flatMap(e=>e.questions);
          if(qs.length!==215) throw new Error(`canonical total=${qs.length}`);
          let mock=0,passed=0,repaired=0,failed=0,notReviewed=0,visual=0;
          for(const q of qs){
            if(!/^[a-f0-9]{64}$/.test(q.contentHash)) throw new Error(`${q.examId} Q${q.questionNumber}: invalid hash`);
            if(q.providerName==='offline-mock'||String(q.modelName).toLowerCase().includes('mock')) mock++;
            if(q.extracted.visualEvidenceRequired) visual++;
            const s=q.analysis.criticStatus; if(s==='passed')passed++; else if(s==='repaired')repaired++; else if(s==='failed')failed++; else if(s==='not_reviewed')notReviewed++;
          }
          if(mock||failed||notReviewed||visual!==40) throw new Error(`canonical gate mock=${mock} failed=${failed} notReviewed=${notReviewed} visual=${visual}`);
          const now=new Date().toISOString(); const corpusHash=crypto.createHash('sha256').update(qs.map(q=>`${q.examId}:Q${q.questionNumber}:${q.contentHash}`).join('\n')).digest('hex');
          const manifest={gitSha:cp.execSync('git rev-parse HEAD').toString().trim(),corpusHash,provider:'openai-chatgpt',model:'gpt-5.6-sol',analysisPromptVersion:'mixed:chatgpt-agent-digestion-v1+v2',criticPromptVersion:'chatgpt-agent-critic-v1',analysisSchemaVersion:'1.0.0',startedAt:now,completedAt:now,totalQuestions:215,successfulQuestions:215,failedQuestions:0,visualQuestionCount:visual,liveOrAgentQuestionCount:215,mockQuestionCount:0,criticPassedCount:passed,criticRepairedCount:repaired,criticFailedCount:0,criticNotReviewedCount:0,repairedByCriticCount:repaired,unresolvedCount:0};
          fs.writeFileSync('history_exams/analyzed/run-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify(manifest,null,2));
          NODE

      - name: Cross-year synthesis
        run: pnpm history-exams synthesize
      - name: Benchmark generation
        run: pnpm history-exams benchmark
      - name: Human spot-check report
        run: pnpm history-exams spot-check
      - name: Corpus validation
        run: pnpm history-exams validate
      - name: Assert authoritative status
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { validateFullCorpus } from './scripts/history-exams/src/validator/index.ts'; const r=validateFullCorpus({extractedDir:path.resolve('history_exams/extracted'),analyzedDir:path.resolve('history_exams/analyzed'),knowledgeDir:path.resolve('history_exams/knowledge'),benchmarkDir:path.resolve('history_exams/benchmark')}); console.log(JSON.stringify(r,null,2)); if(!r.structurallyValid||!r.authorityEligible||r.authorityStatus!=='authoritative') process.exit(1);"

      - name: Final regression locks
        run: pnpm test tests/history-exams/official-answers.test.ts tests/history-exams/extractor.test.ts tests/history-exams/agent-analysis-quality.test.ts tests/history-exams/validator.test.ts
      - name: Lint
        run: pnpm lint
      - name: Full test suite
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

      - name: Commit authoritative CAP corpus and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/history-exams/.tmp-cap-finish.ts
          git rm .github/workflows/cap-finish-once.yml
          git add scripts/history-exams/src/extractor history_exams tests/history-exams
          if git diff --cached --quiet; then echo 'No authoritative changes to commit'; exit 1; fi
          git commit -m "feat(history-exams): certify authoritative CAP digestion"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Remove one-shot workflow after failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git rm -f .github/workflows/cap-finish-once.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(history-exams): remove failed CAP finisher"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
