name: CAP Finish Once

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-finish-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore proven CAP migration runner
        run: git show 0c8caa8f5537ed7a47c9c1743599ea2d912391ef:scripts/history-exams/.tmp-cap-finish.ts > scripts/history-exams/.tmp-cap-finish.ts
      - name: Repair provenance, normalize authored labels, and ingest canonical analyses
        run: pnpm exec tsx scripts/history-exams/.tmp-cap-finish.ts

      - name: Complete authored taxonomy semantics
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p114='history_exams/agent_analysis/114-q01-q22-27-q29-31-q35-37.json';
          const s114=JSON.parse(fs.readFileSync(p114,'utf8'));
          const explanations={
            1:"Q1 combines the location phrase 'over the houses' with a picture containing several visible flying objects, so the learner must use spatial evidence to select the plane.",
            22:"Q22 requires tracking speakers across the group chat and inferring Linda's attitude toward Mark from her repeated objections and final reaction.",
            23:"Q23 requires inferring the social meaning of 'steal someone's thunder' from the dialogue and transferring that attention-stealing mechanism to a new scenario.",
            24:"Q24 checks precise brochure-detail integration by separating unlimited transport, museum discounts, and zone restrictions that are easy to recombine incorrectly.",
            25:"Q25 integrates the city-zone map, weekday versus weekend validity, and the price table to identify the cheapest combination that satisfies both planned trips.",
            26:"Q26 requires abstracting the category 'vacation farm' from Rolling Acres' combined farm features, animals, crops, and family-vacation function.",
            27:"Q27 is a scope-sensitive main-idea task: the learner must summarize what the first paragraph develops about Libby's work rather than select nearby undeveloped topics.",
            29:"Q29 requires synthesizing a multi-panel causal sequence from resource abundance through depletion, scarcity, conflict, and collapse into the comic's environmental warning.",
            30:"Q30 tests proposition-level detail tracking in the comic, especially the stated purpose for moving statues to fighting grounds rather than keyword recombination.",
            31:"Q31 resolves the event anaphor 'did it' across a concessive sentence, linking it to cutting down the last trees rather than to a nearby consequence or earlier action.",
            35:"Q35 asks for the passage's organizing purpose by linking a historical electricity-worker image to the labor-dispute history supplied as its explanatory context.",
            36:"Q36 integrates the historical image with repeated pay demands and widespread public hardship to infer the critical attitude represented by the picture.",
            37:"Q37 interprets quotation marks around 'dark' by integrating literal electricity-related darkness with the figurative social hardship of the period."
          };
          for(const q of s114.questions){ q.skillExplanation=explanations[q.questionNumber] ?? q.skillExplanation; }
          fs.writeFileSync(p114,JSON.stringify(s114,null,2)+'\n');

          const p115='history_exams/agent_analysis/115-q35-43.json';
          const s115=JSON.parse(fs.readFileSync(p115,'utf8'));
          const q38=s115.questions.find(q=>q.questionNumber===38);
          if(!q38) throw new Error('115 Q38 missing');
          q38.primarySkill='cross_sentence_inference';
          q38.secondarySkills=[...new Set(['information_integration',...(q38.secondarySkills||[])])];
          fs.writeFileSync(p115,JSON.stringify(s115,null,2)+'\n');
          NODE

      - name: Consolidate genuine authored fragments into yearly 43-question sources
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const path=require('node:path');
          const dir=path.resolve('history_exams/agent_analysis');
          const meta={providerName:'openai-chatgpt',modelName:'gpt-5.6-sol',promptVersion:'chatgpt-agent-digestion-v2',criticPromptVersion:'chatgpt-agent-critic-v1',analysisSchemaVersion:'1.0.0'};
          for(const examId of ['112','113','114','115']){
            const files=fs.readdirSync(dir).filter(f=>f===`${examId}.json`||f.startsWith(`${examId}-`)).sort();
            const qs=new Map();
            for(const file of files){
              const s=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
              for(const [k,v] of Object.entries(meta)) if(s[k]!==v) throw new Error(`${examId}/${file}: ${k} mismatch`);
              for(const q of s.questions){
                if(qs.has(q.questionNumber)&&JSON.stringify(qs.get(q.questionNumber))!==JSON.stringify(q)) throw new Error(`${examId} Q${q.questionNumber}: conflicting source records`);
                qs.set(q.questionNumber,q);
              }
            }
            const missing=Array.from({length:43},(_,i)=>i+1).filter(n=>!qs.has(n));
            if(qs.size!==43) throw new Error(`${examId}: ${qs.size} questions; missing ${missing.join(',')}`);
            fs.writeFileSync(path.join(dir,`${examId}.json`),JSON.stringify({examId,...meta,questions:[...qs.values()].sort((a,b)=>a.questionNumber-b.questionNumber)},null,2)+'\n');
            for(const f of files) if(f!==`${examId}.json`) fs.unlinkSync(path.join(dir,f));
          }
          NODE

      - name: Verify source diversity floors
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const qs=['111','112','113','114','115'].flatMap(id=>JSON.parse(fs.readFileSync(`history_exams/agent_analysis/${id}.json`,'utf8')).questions);
          if(qs.length!==215) throw new Error(`questions=${qs.length}`);
          for(const key of ['questionMechanism','whyTheQuestionWorks','reusableDesignPrinciple','skillExplanation']){
            const values=new Set(qs.map(q=>q[key]));
            if(values.size<200) throw new Error(`${key} unique=${values.size}`);
            if(qs.some(q=>!String(q[key]||'').trim())) throw new Error(`${key}: blank value remains`);
          }
          const banned=['exact wording and evidence configuration','Preserve the evidence pattern while changing surface content'];
          for(const q of qs) for(const x of banned) if(JSON.stringify(q).includes(x)) throw new Error(`banned boilerplate: ${x}`);
          NODE

      - name: Verify representative semantic locks
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const m=new Map();
          for(const id of ['111','112','113','114','115']) for(const q of JSON.parse(fs.readFileSync(`history_exams/agent_analysis/${id}.json`,'utf8')).questions) m.set(`${id}-Q${q.questionNumber}`,q);
          const checks=[
            ['111-Q2','primarySkill','discourse_relationship'],['111-Q41','primarySkill','information_integration'],
            ['112-Q24','cognitiveDepth','D3_multi_step_synthesis'],['113-Q28','primarySkill','pragmatic_meaning'],
            ['114-Q34','cognitiveDepth','D4_evaluative_pragmatic'],['115-Q26','primarySkill','information_integration'],
            ['115-Q26','cognitiveDepth','D3_multi_step_synthesis'],['115-Q38','primarySkill','cross_sentence_inference'],
            ['115-Q38','cognitiveDepth','D3_multi_step_synthesis']
          ];
          for(const [k,f,v] of checks) if(m.get(k)?.[f]!==v) throw new Error(`${k}.${f}=${m.get(k)?.[f]} expected ${v}`);
          NODE

      - name: Re-ingest persisted monolithic authored sources
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { ingestAgentAnalysisFiles } from './scripts/history-exams/src/agent-ingest/index.ts'; const o={sourceDir:path.resolve('history_exams/agent_analysis'),extractedDir:path.resolve('history_exams/extracted'),analyzedDir:path.resolve('history_exams/analyzed')}; for (const id of ['112','113','114','115']) { const r=ingestAgentAnalysisFiles({...o,examIdFilter:id}); if(r.ingestedQuestions!==43) throw new Error(id+': expected 43, got '+r.ingestedQuestions); }"
      - name: Assert 215 canonical analyses and zero mocks
        run: |
          node <<'NODE'
          const fs=require('node:fs'); let total=0;
          for(const id of ['111','112','113','114','115']){const e=JSON.parse(fs.readFileSync(`history_exams/analyzed/${id}.json`,'utf8')); if(e.questions.length!==43)throw new Error(`${id}: ${e.questions.length}`); for(const q of e.questions){if(!/^[a-f0-9]{64}$/.test(q.contentHash))throw new Error(`${id} Q${q.questionNumber}: bad hash`); if(q.providerName==='offline-mock'||String(q.modelName).toLowerCase().includes('mock'))throw new Error(`${id} Q${q.questionNumber}: mock`);} total+=43;} if(total!==215)throw new Error(`total=${total}`);
          NODE

      - name: Cross-year synthesis
        run: pnpm history-exams synthesize
      - name: Benchmark generation
        run: pnpm history-exams benchmark
      - name: Human spot-check report
        run: pnpm history-exams spot-check
      - name: Corpus validation
        run: pnpm history-exams validate
      - name: Assert authoritative status
        run: pnpm exec tsx -e "import path from 'node:path'; import { validateFullCorpus } from './scripts/history-exams/src/validator/index.ts'; const r=validateFullCorpus({extractedDir:path.resolve('history_exams/extracted'),analyzedDir:path.resolve('history_exams/analyzed'),knowledgeDir:path.resolve('history_exams/knowledge'),benchmarkDir:path.resolve('history_exams/benchmark')}); console.log(JSON.stringify(r,null,2)); if(!r.authorityEligible||r.authorityStatus!=='authoritative')process.exit(1);"
      - name: Verify official answer regression lock
        run: pnpm test tests/history-exams/official-answers.test.ts
      - name: Verify monolithic deep-analysis quality regression
        run: pnpm test tests/history-exams/agent-analysis-quality.test.ts
      - name: Lint
        run: pnpm lint
      - name: Full test suite
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

      - name: Commit authoritative CAP corpus and self-clean
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/history-exams/.tmp-cap-finish.ts
          git rm .github/workflows/cap-finish-once.yml
          git add -A history_exams
          if git diff --cached --quiet; then echo 'No generated changes'; exit 1; fi
          git commit -m "feat(history-exams): finish authoritative CAP digestion"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Remove one-shot workflow after failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD; git rm -f .github/workflows/cap-finish-once.yml || true
          if ! git diff --cached --quiet; then git commit -m "chore(history-exams): remove failed CAP finisher"; git push origin HEAD:${GITHUB_REF_NAME}; fi
