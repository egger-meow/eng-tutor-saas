name: CAP Finish Once

on:
  push:
    branches:
      - feat/cap-chatgpt-deep-digestion
    paths:
      - .github/workflows/cap-finish-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore proven CAP migration runner
        run: git show 0c8caa8f5537ed7a47c9c1743599ea2d912391ef:scripts/history-exams/.tmp-cap-finish.ts > scripts/history-exams/.tmp-cap-finish.ts

      - name: Repair provenance, normalize authored labels, and ingest canonical analyses
        run: pnpm exec tsx scripts/history-exams/.tmp-cap-finish.ts

      - name: Consolidate genuine authored fragments into yearly 43-question sources
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.resolve('history_exams/agent_analysis');
          const expectedMeta = {
            providerName:'openai-chatgpt', modelName:'gpt-5.6-sol',
            promptVersion:'chatgpt-agent-digestion-v2', criticPromptVersion:'chatgpt-agent-critic-v1', analysisSchemaVersion:'1.0.0'
          };
          for (const examId of ['112','113','114','115']) {
            const files = fs.readdirSync(dir).filter(f => f === `${examId}.json` || f.startsWith(`${examId}-`)).sort();
            const questions = new Map();
            for (const file of files) {
              const source = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              for (const [key,value] of Object.entries(expectedMeta)) {
                if (source[key] !== value) throw new Error(`${examId}/${file}: ${key}=${JSON.stringify(source[key])}, expected ${JSON.stringify(value)}`);
              }
              for (const q of source.questions) {
                if (questions.has(q.questionNumber)) {
                  const prior = JSON.stringify(questions.get(q.questionNumber));
                  const next = JSON.stringify(q);
                  if (prior !== next) throw new Error(`${examId} Q${q.questionNumber}: conflicting authored records while reading ${file}`);
                  continue;
                }
                questions.set(q.questionNumber, q);
              }
            }
            const missing = Array.from({length:43},(_,i)=>i+1).filter(n=>!questions.has(n));
            if (questions.size !== 43) throw new Error(`${examId}: expected 43 unique authored questions, got ${questions.size}; missing=${missing.join(',')}`);
            const merged = { examId, ...expectedMeta, questions:[...questions.values()].sort((a,b)=>a.questionNumber-b.questionNumber) };
            fs.writeFileSync(path.join(dir, `${examId}.json`), JSON.stringify(merged, null, 2) + '\n');
            for (const file of files) if (file !== `${examId}.json`) fs.unlinkSync(path.join(dir, file));
            console.log(`[consolidate] ${examId}: ${files.length} files -> 43 questions`);
          }
          NODE

      - name: Re-ingest persisted monolithic authored sources
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { ingestAgentAnalysisFiles } from './scripts/history-exams/src/agent-ingest/index.ts'; const o={sourceDir:path.resolve('history_exams/agent_analysis'),extractedDir:path.resolve('history_exams/extracted'),analyzedDir:path.resolve('history_exams/analyzed')}; for (const id of ['112','113','114','115']) { const r=ingestAgentAnalysisFiles({...o,examIdFilter:id}); if(r.ingestedQuestions!==43) throw new Error(id+': expected 43 monolithic records, got '+r.ingestedQuestions); }"

      - name: Assert 215 canonical analyses and zero mocks
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let total=0;
          for(const id of ['111','112','113','114','115']){
            const e=JSON.parse(fs.readFileSync(`history_exams/analyzed/${id}.json`,'utf8'));
            if(e.questions.length!==43) throw new Error(`${id}: ${e.questions.length}`);
            for(const q of e.questions){
              if(!/^[a-f0-9]{64}$/.test(q.contentHash)) throw new Error(`${id} Q${q.questionNumber}: bad hash`);
              if(q.providerName==='offline-mock'||String(q.modelName).toLowerCase().includes('mock')) throw new Error(`${id} Q${q.questionNumber}: mock remains`);
            }
            total+=e.questions.length;
          }
          if(total!==215) throw new Error(`total=${total}`);
          console.log('canonical live-or-agent: 215/215; mocks: 0');
          NODE

      - name: Cross-year synthesis
        run: pnpm history-exams synthesize
      - name: Benchmark generation
        run: pnpm history-exams benchmark
      - name: Human spot-check report
        run: pnpm history-exams spot-check
      - name: Corpus validation
        run: pnpm history-exams validate
      - name: Assert authoritative status
        run: |
          pnpm exec tsx -e "import path from 'node:path'; import { validateFullCorpus } from './scripts/history-exams/src/validator/index.ts'; const r=validateFullCorpus({extractedDir:path.resolve('history_exams/extracted'),analyzedDir:path.resolve('history_exams/analyzed'),knowledgeDir:path.resolve('history_exams/knowledge'),benchmarkDir:path.resolve('history_exams/benchmark')}); console.log(JSON.stringify(r,null,2)); if(!r.authorityEligible || r.authorityStatus!=='authoritative') process.exit(1);"

      - name: Verify official answer regression lock
        run: pnpm test tests/history-exams/official-answers.test.ts
      - name: Verify monolithic deep-analysis quality regression
        run: pnpm test tests/history-exams/agent-analysis-quality.test.ts
      - name: Lint
        run: pnpm lint
      - name: Full test suite
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

      - name: Commit authoritative CAP corpus and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/history-exams/.tmp-cap-finish.ts
          git rm .github/workflows/cap-finish-once.yml
          git add -A history_exams
          if git diff --cached --quiet; then echo 'No generated changes'; exit 1; fi
          git commit -m "feat(history-exams): finish authoritative CAP digestion"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Remove one-shot workflow after failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git rm -f .github/workflows/cap-finish-once.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(history-exams): remove failed CAP finisher"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
