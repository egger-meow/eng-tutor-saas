openapi: 3.0.3
info:
  title: Paper English Curriculum Authoring Bridge API
  description: >
    Narrow, purpose-built HTTP API for online curriculum authoring.
    Exposes only narrow, business-level operations with zero generic SQL
    or database access, removing generic database query capability and minimizing
    the externally exposed write surface.
  version: 1.2.0
servers:
  - url: https://ykzszjrqynrhgdhoeovo.supabase.co/functions/v1/authoring-bridge
    description: Production Supabase Edge Functions Authoring Bridge
paths:
  /start:
    post:
      summary: Start Authoritative Production Authoring Batch
      description: >
        Atomically verifies that zero conflicting active authoring leases exist across
        the entire production queue, then performs exactly one authoritative production
        batch claim under the pinned online manual worker identity (chatgpt-online-manual).
        Returns authoritative generation contexts with inputFingerprint and any retryContext.
      operationId: startAuthoringBatch
      responses:
        '200':
          description: Batch claimed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  bridgeVersion:
                    type: string
                  claimedCount:
                    type: integer
                  claimed:
                    type: array
                    items:
                      type: object
                      properties:
                        jobId:
                          type: string
                          format: uuid
                        childId:
                          type: string
                          format: uuid
                        targetWeek:
                          type: string
                        inputFingerprint:
                          type: string
                        profile:
                          type: object
                        curriculumCapsules:
                          type: array
                          items:
                            type: object
                        retryContext:
                          type: object
                  normalCapacity:
                    type: integer
                  mandatoryCapacityOverride:
                    type: boolean
                  oldestOutstandingDeadline:
                    type: string
        '401':
          description: Missing or invalid authorization token
        '409':
          description: Conflicting active authoring lease currently held by another worker
        '500':
          description: Server error
        '503':
          description: Bridge secret not configured

  /batch:
    get:
      summary: Recover Active Staged Batch
      description: >
        Recovers an already-claimed active batch of due curriculum generation jobs
        without mutating database state or triggering a new claim.
        Worker identity is pinned server-side.
      operationId: recoverActiveBatch
      responses:
        '200':
          description: Active batch claimed jobs snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  bridgeVersion:
                    type: string
                  source:
                    type: string
                  claimed:
                    type: array
                    items:
                      type: object
                      properties:
                        jobId:
                          type: string
                          format: uuid
                        childId:
                          type: string
                          format: uuid
                        targetWeek:
                          type: string
                        inputFingerprint:
                          type: string
                        profile:
                          type: object
                        curriculumCapsules:
                          type: array
                          items:
                            type: object
                        retryContext:
                          type: object
                  claimedCount:
                    type: integer
                  normalCapacity:
                    type: integer
                  mandatoryCapacityOverride:
                    type: boolean
                  oldestOutstandingDeadline:
                    type: string
        '401':
          description: Missing or invalid authorization token
        '500':
          description: Server error
        '503':
          description: Bridge secret not configured

  /submit:
    post:
      summary: Submit Canonical Curriculum Package
      description: >
        Submits an authored and locally validated canonical curriculum package
        into private_generation.curriculum_submissions for deterministic Finisher rendering.
        Worker identity is pinned server-side to reviewed online author identities.
      operationId: submitCurriculumPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobId
                - package
              properties:
                jobId:
                  type: string
                  format: uuid
                  description: Target generation job UUID
                package:
                  type: object
                  description: Full Canonical CurriculumPackage 2.4.0 payload
                  properties:
                    metadata:
                      type: object
                      required:
                        - schemaVersion
                        - jobId
                        - childId
                        - inputFingerprint
                      properties:
                        schemaVersion:
                          type: string
                          example: '2.4.0'
                        jobId:
                          type: string
                          format: uuid
                        childId:
                          type: string
                          format: uuid
                        inputFingerprint:
                          type: string
      responses:
        '200':
          description: Package submission accepted and recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  persisted:
                    type: boolean
                  jobId:
                    type: string
                    format: uuid
                  submissionId:
                    type: string
                    format: uuid
                  authoringAttempt:
                    type: integer
                  deduplicated:
                    type: boolean
                  status:
                    type: string
                    example: pending
        '400':
          description: Invalid payload, missing fields, or validation error
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /status:
    get:
      summary: Check Curriculum Submission Status
      description: >
        Performs read-after-write verification to verify that an immutable submission
        exists and inspect its processing status.
        Worker identity is pinned server-side.
      operationId: getSubmissionStatus
      parameters:
        - name: job_id
          in: query
          required: true
          description: Generation job UUID to check
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Submission status details
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  submissionFound:
                    type: boolean
                  status:
                    type: string
                    enum: [pending, completed, failed, not_found]
                  authoringAttempt:
                    type: integer
        '400':
          description: Missing job_id parameter
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /release:
    post:
      summary: Release Unsubmitted Claim
      description: >
        Narrow release operation that verifies no immutable curriculum submission exists
        for the current authoring attempt before releasing the claim back to pending.
        Worker identity is pinned server-side.
      operationId: releaseUnsubmittedClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobId
              properties:
                jobId:
                  type: string
                  format: uuid
                  description: Target generation job UUID
                errorCode:
                  type: string
                  description: Short error category code
                  example: SUBMIT_TRANSPORT_FAILED
                errorMessage:
                  type: string
                  description: Actionable failure reason
      responses:
        '200':
          description: Claim successfully released back to pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending
        '400':
          description: Missing required fields or submission exists
        '401':
          description: Unauthorized
        '500':
          description: Server error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Dedicated authoring bridge secret token (AUTHORING_BRIDGE_SECRET)
security:
  - BearerAuth: []
